name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/test_deploy_unsigned.yml
  pull_request:
    branches: [main]
    paths:
      - app.js
      - db.js
      - app.test.js
      - dist/**
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - eslint.config.js
      - .github/actions/**
      - .github/workflows/ci.yml
      - .github/workflows/deploy.yml
      - .github/workflows/release.yml
      - .github/workflows/reusable-build.yml
      - sonar-project.properties

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-22.04, ubuntu-24.04]
        exclude:
          - { node: 18, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == 22 && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download Trivy HTML template
        run: |
          curl -sL -o trivy-html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      - name: Scan for secrets with Trivy
        id: secret-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: template
          template: '@trivy-html.tpl'
          output: trivy-secrets-report.html
          exit-code: '1'
          scanners: secret
          timeout: 5m0s

      - name: Upload secret scan report
        if: always() && steps.secret-scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6db9b8a4d0d969e902c97e56c3075 # v4.6.2
        with:
          name: trivy-secrets-report
          path: trivy-secrets-report.html
          retention-days: 30

      - name: Scan IaC with Trivy
        id: iac-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: template
          template: '@trivy-html.tpl'
          output: trivy-iac-report.html
          exit-code: '1'
          severity: HIGH,CRITICAL
          timeout: 5m0s

      - name: Upload IaC scan report
        if: always() && steps.iac-scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6db9b8a4d0d969e902c97e56c3075 # v4.6.2
        with:
          name: trivy-iac-report
          path: trivy-iac-report.html
          retention-days: 30

  build-and-push:
    needs: [lint, test, sonar, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      image_name: demo-app
      image_tag: sha-${{ github.sha }}

  sign-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}@${{ needs.build-and-push.outputs.image_digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify signature identity
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image_ref }}@${{ needs.build-and-push.outputs.image_digest }}
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
        run: |
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity="$EXPECTED_IDENTITY"

      - name: Move latest tag to verified digest
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REF:latest" \
            "$IMAGE_REF@$IMAGE_DIGEST"

          latest_digest="$(docker buildx imagetools inspect "$IMAGE_REF:latest" --format '{{.Manifest.Digest}}')"
          test "$latest_digest" = "$IMAGE_DIGEST"
  update-manifest:
    needs: [build-and-push, sign-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Manifest Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository_owner }}/app_of_apps
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Install yq
        uses: mikefarah/yq@751d8ad57b84f1794661bc70c0afb92a22ad7b3c

      - name: Update Digest in Manifest Overlay
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          cd manifest-repo
          yq eval -i ".image.digest = \"$IMAGE_DIGEST\"" charts/demo-app/values-demo.yaml

          if git diff --quiet; then
            echo "Digest hasn't changed. Skipping commit."
            exit 0
          fi

      - name: Commit and Push Digest to Manifest Repo
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          cd manifest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/demo-app/values-demo.yaml
          git commit -m "chore(deploy): pin demo-app digest to $IMAGE_DIGEST"
          git push origin main
