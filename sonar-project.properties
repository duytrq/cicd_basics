# ── SonarCloud Project Identification ──
sonar.organization=duytrq
sonar.projectKey=duytrq_cicd_basics
sonar.projectName=cicd_basics

# ── Source & Test Configuration ──
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.js
